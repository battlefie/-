<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>郑航体育自动预约配置</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      margin: 0 auto;
      background: #020617;
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
      border: 1px solid #1f2937;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 16px;
      margin-top: 20px;
      margin-bottom: 8px;
      color: #9ca3af;
    }
    label {
      display: block;
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px #38bdf8;
    }
    .row {
      display: flex;
      gap: 12px;
    }
    .row > div {
      flex: 1;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    .primary {
      background: linear-gradient(135deg, #22c55e, #22d3ee);
      color: #020617;
    }
    .secondary {
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #374151;
    }
    .hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    .status {
      margin-top: 10px;
      font-size: 13px;
    }
    .status.ok { color: #22c55e; }
    .status.err { color: #f97316; }
  </style>
</head>
<body>
  <div class="card">
    <h1>郑航体育自动预约配置</h1>
    <div class="hint">生成 <code>config/user-config.json</code>，供 Python 抢号脚本读取。</div>

    <h2>一、个人信息</h2>
    <label>手机号</label>
    <input id="tel" placeholder="例如 18436900381" />

    <label>姓名</label>
    <input id="realname" placeholder="只填中文姓名" />

    <div class="row">
      <div>
        <label>性别</label>
        <select id="sex">
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
      <div>
        <label>工(学)号</label>
        <input id="userno" placeholder="6/10/12 位" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>同行人数（可选）</label>
        <input id="yy_number" placeholder="留空或 0-3" />
      </div>
      <div>
        <label>同行人姓名（可选）</label>
        <input id="tx_realname" placeholder="可为空" />
      </div>
    </div>

    <h2>二、场馆与项目</h2>
    <div class="row">
      <div>
        <label>场馆 ID (cgid)</label>
        <input id="cgid" placeholder="例如 5（东体育馆）" />
      </div>
      <div>
        <label>项目 ID (ydxmid)</label>
        <input id="ydxmid" placeholder="例如 1=羽毛球, 2=乒乓球" />
      </div>
    </div>
    <div class="hint">cgid/ydxmid 可在抓包时从 URL 或表单参数里看到。</div>

    <h2>三、时间与场地</h2>
    <div class="row">
      <div>
        <label>目标格子 ID (cdid)</label>
        <input id="cdid" placeholder="例如 20_1（sd_场地号），可留默认让脚本自动选" />
      </div>
      <div>
        <label>日期 (days)</label>
        <select id="days">
          <option value="AUTO_TODAY">AUTO_TODAY（始终抢当天）</option>
          <option value="MANUAL">手动指定</option>
        </select>
      </div>
    </div>
    <input id="daysManual" placeholder="手动日期，例如 03/16" style="display:none;" />

    <div class="hint">
      - 默认：每天早上 6 点配合 <code>wait6</code> 模式抢「当天」场次。<br/>
      - 若选择“手动指定”，请输入 <code>MM/DD</code> 格式，例如 <code>03/16</code>。
    </div>

    <h2>四、生成配置</h2>
    <button class="primary" id="btnSave">下载 user-config.json</button>
    <button class="secondary" id="btnFillDemo">填入示例数据</button>

    <div id="status" class="status"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const statusEl = $("status");

    $("days").addEventListener("change", () => {
      $("daysManual").style.display = $("days").value === "MANUAL" ? "block" : "none";
    });

    $("btnFillDemo").addEventListener("click", () => {
      $("tel").value = "18436900381";
      $("realname").value = "刁越洋";
      $("sex").value = "男";
      $("userno").value = "2107210303";
      $("yy_number").value = "";
      $("tx_realname").value = "";
      $("cgid").value = "5";
      $("ydxmid").value = "2";
      $("cdid").value = "20_1";
      $("days").value = "AUTO_TODAY";
      $("daysManual").value = "";
      statusEl.textContent = "已填入示例配置，请按自己情况修改。";
      statusEl.className = "status ok";
    });

    $("btnSave").addEventListener("click", () => {
      const tel = $("tel").value.trim();
      const realname = $("realname").value.trim();
      const sex = $("sex").value;
      const userno = $("userno").value.trim();
      const cgid = $("cgid").value.trim();
      const ydxmid = $("ydxmid").value.trim();
      const cdid = $("cdid").value.trim() || "20_1";
      const daysMode = $("days").value;
      const daysManual = $("daysManual").value.trim();

      if (!tel || !realname || !userno || !cgid || !ydxmid) {
        statusEl.textContent = "手机号 / 姓名 / 学号 / 场馆 ID / 项目 ID 为必填项。";
        statusEl.className = "status err";
        return;
      }

      let days = "AUTO_TODAY";
      if (daysMode === "MANUAL") {
        if (!/^\d{2}\/\d{2}$/.test(daysManual)) {
          statusEl.textContent = "手动日期格式应为 MM/DD，例如 03/16。";
          statusEl.className = "status err";
          return;
        }
        days = daysManual;
      }

      const conf = {
        tel,
        realname,
        sex,
        userno,
        yy_number: $("yy_number").value.trim(),
        tx_realname: $("tx_realname").value.trim(),
        cgid,
        ydxmid,
        cdid,
        days
      };

      const blob = new Blob([JSON.stringify(conf, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "user-config.json";
      a.click();
      URL.revokeObjectURL(a.href);

      statusEl.textContent = "已下载 user-config.json，请放到项目的 config/ 目录下。";
      statusEl.className = "status ok";
    });
  </script>
</body>
</html>
