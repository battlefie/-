spring:
  application:
    name: study-abroad-management-system

  datasource:
    url: jdbc:mysql://localhost:3306/study_abroad_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
    username: root
    password: 39608679

    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  mvc:
    static-path-pattern: /**

  web:
    resources:
      static-locations: classpath:/static/

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB  # 单个文件最大50MB
      max-request-size: 50MB  # 请求最大50MB

server:
  port: 8080
  servlet:
    context-path: /

# JWT配置
jwt:
  secret: studyAbroadManagementSystemSecretKey2024ForJWTTokenGeneration
  expiration: 86400000 # 24小时，单位毫秒

# 文件上传配置
file:
  upload-dir: uploads  # 文件保存目录（相对于项目根目录，文件系统存储时使用）
  max-size: 52428800  # 最大文件大小（50MB，单位：字节）
  storage-type: database  # 存储类型：database（数据库）或 filesystem（文件系统）

# 日志配置
logging:
  level:
    root: INFO
    com.studyabroad: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

