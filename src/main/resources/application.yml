spring:
  application:
    name: study-abroad-management-system

  datasource:
    url: jdbc:mysql://localhost:3306/study_abroad_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
    username: root
    password: 39608679
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  mvc:
    static-path-pattern: /**

  web:
    resources:
      static-locations: classpath:/static/

server:
  port: 8080
  servlet:
    context-path: /

# JWT配置
jwt:
  secret: studyAbroadManagementSystemSecretKey2024ForJWTTokenGeneration
  expiration: 86400000 # 24小时，单位毫秒

# 日志配置
logging:
  level:
    root: INFO
    com.studyabroad: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

