    <!-- 查看学生信息模态框 -->
    <div id="viewStudentModal" class="modal">
        <div class="modal-content" style="max-width: 1000px; max-height: 90vh; overflow-y: auto;">
            <span class="close" onclick="closeViewModal()">&times;</span>
            <h2 id="viewStudentTitle">学生详细信息</h2>
            
            <div id="viewStudentContent">
                <!-- 学生信息将在这里显示 -->
            </div>
            
            <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e1e5e9;">
                <button class="btn btn-secondary" onclick="closeViewModal()">关闭</button>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/roleManager.js"></script>
    <script>
        let students = [];
        let paginationData = { currentPage: 0, totalPages: 0, totalElements: 0, pageSize: 10 };

        // 文案角色加载学生数据（通过申请关联）
        async function loadWriterStudentData() {
            try {
                // 文案角色通过申请来查看相关学生信息
                const data = await apiRequest('/applications');
                if (data.code === 200) {
                    // 从申请中提取学生信息
                    const studentMap = new Map();
                    data.data.forEach(application => {
                        if (application.student && !studentMap.has(application.student.id)) {
                            studentMap.set(application.student.id, application.student);
                        }
                    });
                    students = Array.from(studentMap.values());
                    displayStudents(students);
                }
            } catch (error) {
                console.error('加载文案学生数据失败:', error);
                if (roleManager) {
                    roleManager.showPermissionDenied('无法加载学生信息');
                }
            }
        }

        async function loadStudents(page = 0) {
            try {
                // 检查权限
                if (roleManager && roleManager.isWriter()) {
                    // 文案角色只能看到分配给自己的申请相关学生信息
                    await loadWriterStudentData();
                } else {
                    // 管理员和咨询顾问可以看到所有学生（使用分页）
                    console.log('请求分页数据，page=', page);
                    const data = await apiRequest(`/students?page=${page}&size=10`);
                    console.log('返回数据:', data);
                    if (data.code === 200) {
                        // 检查返回的是分页数据还是列表数据
                        if (data.data.content) {
                            // 分页数据
                            console.log('使用分页数据');
                            students = data.data.content;
                            paginationData = {
                                currentPage: data.data.currentPage,
                                totalPages: data.data.totalPages,
                                totalElements: data.data.totalElements,
                                pageSize: data.data.pageSize
                            };
                            console.log('分页信息:', paginationData);
                            displayStudents(students);
                            displayPagination();
                        } else {
                            // 列表数据（向后兼容）
                            console.log('使用列表数据（非分页）');
                            students = data.data;
                            paginationData = {
                                currentPage: 0,
                                totalPages: 1,
                                totalElements: students.length,
                                pageSize: 10
                            };
                            displayStudents(students);
                            displayPagination();
                        }
                    }
                }
            } catch (error) {
                console.error('加载学生数据失败:', error);
                if (roleManager) {
                    roleManager.showPermissionDenied('无法加载学生信息');
                }
            }
        }

        function displayPagination() {
            const paginationDiv = document.getElementById('pagination');
            
            console.log('分页数据:', paginationData);
            
            // 总是显示分页信息，即使只有一页
            let html = '';
            
            // 只有当有多页时才显示翻页按钮
            if (paginationData.totalPages > 1) {
                // 首页按钮
                if (paginationData.currentPage > 0) {
                    html += `<button class="btn btn-small" onclick="loadStudents(0)">首页</button>`;
                    html += `<button class="btn btn-small" onclick="loadStudents(${paginationData.currentPage - 1})">上一页</button>`;
                }
                
                // 尾页按钮
                if (paginationData.currentPage < paginationData.totalPages - 1) {
                    html += `<button class="btn btn-small" onclick="loadStudents(${paginationData.currentPage + 1})">下一页</button>`;
                    html += `<button class="btn btn-small" onclick="loadStudents(${paginationData.totalPages - 1})">尾页</button>`;
                }
                
                // 添加跳转功能
                html += `<span style="margin-left: 20px;">
                    <input type="number" id="pageJumpInput" min="1" max="${paginationData.totalPages}" 
                           value="${paginationData.currentPage + 1}" 
                           style="width: 60px; padding: 5px; border: 1px solid #ddd; border-radius: 4px; margin: 0 5px;"
                           onkeypress="if(event.key === 'Enter') jumpToPage()">
                    <button class="btn btn-small" onclick="jumpToPage()">跳转</button>
                </span>`;
            }
            
            // 显示统计信息（总是显示）
            html += `<span style="margin-left: 20px; color: #666;">共 ${paginationData.totalElements} 条记录，第 ${paginationData.currentPage + 1}/${paginationData.totalPages} 页</span>`;
            
            paginationDiv.innerHTML = html;
        }
        
        function jumpToPage() {
            const input = document.getElementById('pageJumpInput');
            if (!input) return;
            
            const pageNumber = parseInt(input.value);
            const totalPages = paginationData.totalPages;
            
            if (isNaN(pageNumber) || pageNumber < 1 || pageNumber > totalPages) {
                alert(`请输入1到${totalPages}之间的页数！`);
                input.value = paginationData.currentPage + 1;
                return;
            }
            
            loadStudents(pageNumber - 1);
        }

        function displayStudents(students) {
            const container = document.getElementById('studentsTable');
            
            if (students.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #999;">暂无学生数据</p>`;
                return;
            }
            
            // 检查是否为管理员，只有管理员可以删除学生
            const canDelete = roleManager && roleManager.isAdmin();
            
            let html = '<table><thead><tr><th>姓名</th><th>学生来源</th><th>状态</th><th>性别</th><th>国籍</th><th>现就读学校</th><th>专业</th><th>GPA</th><th>托福</th><th>雅思</th><th>微信</th><th>咨询顾问</th><th>文案</th><th>出生日期</th><th>操作</th></tr></thead><tbody>';
            
            students.forEach(student => {
                html += `<tr>
                    <td>${student.name || 'N/A'}</td>
                    <td>${student.studentSource || 'N/A'}</td>
                    <td>${student.status || 'N/A'}</td>
                    <td>${student.gender || 'N/A'}</td>
                    <td>${student.nationality || 'N/A'}</td>
                    <td>${student.currentSchool || 'N/A'}</td>
                    <td>${student.major || 'N/A'}</td>
                    <td>${student.gpa || 'N/A'}</td>
                    <td>${student.toeflScore || 'N/A'}</td>
                    <td>${student.ieltsScore || 'N/A'}</td>
                    <td>${student.wechat || 'N/A'}</td>
                    <td>${student.counselor ? student.counselor.realName : 'N/A'}</td>
                    <td>${student.writer ? student.writer.realName : 'N/A'}</td>
                    <td>${student.birthDate || 'N/A'}</td>
                    <td>
                        <button class="btn btn-small btn-info" onclick="viewStudent(${student.id})">查看</button>
                        <button class="btn btn-small" onclick="editStudent(${student.id})">编辑</button>
                        ${canDelete ? `<button class="btn btn-small btn-danger" onclick="deleteStudent(${student.id})">删除</button>` : ''}
                    </td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        async function showAddModal() {
            // 检查权限
            if (roleManager && !roleManager.hasPermission('student_management')) {
                roleManager.showPermissionDenied('学生角色只能管理自己的信息');
                return;
            }
            
            document.getElementById('modalTitle').textContent = roleManager && roleManager.isStudent() ? '完善我的资料' : '添加学生';
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('userId').value = '';
            
            // 如果是咨询顾问，自动设置咨询顾问为自己，并禁用该字段
            if (roleManager && roleManager.isCounselor()) {
                try {
                    const userResponse = await apiRequest('/users/me');
                    if (userResponse.code === 200) {
                        const currentUser = userResponse.data;
                        const counselorSelect = document.getElementById('counselorName');
                        if (counselorSelect && currentUser.realName) {
                            // 设置为当前咨询顾问
                            counselorSelect.value = currentUser.realName;
                            // 禁用选择框
                            counselorSelect.disabled = true;
                            counselorSelect.style.backgroundColor = '#f5f5f5';

        function showMessage(message, type = 'info') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 5px;
                color: white;
                font-weight: bold;
                z-index: 9999;
                max-width: 400px;
                word-wrap: break-word;
            `;
            
            if (type === 'success') {
                alertDiv.style.backgroundColor = '#28a745';
            } else if (type === 'error') {
                alertDiv.style.backgroundColor = '#dc3545';
            } else if (type === 'warning') {
                alertDiv.style.backgroundColor = '#ffc107';
                alertDiv.style.color = '#000';
            } else {
                alertDiv.style.backgroundColor = '#17a2b8';
            }
            
            alertDiv.textContent = message;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }

        // 加载咨询顾问和文案选项
        async function loadCounselorsAndWriters() {
            try {
                const data = await apiRequest('/users');
                if (data.code === 200) {
                    const counselors = data.data.filter(user => user.role === 'COUNSELOR');
                    const writers = data.data.filter(user => user.role === 'WRITER');
                    
                    // 填充咨询顾问选项
                    const counselorSelect = document.getElementById('counselorName');
                    counselorSelect.innerHTML = ''; // 不添加默认选项
                    counselors.forEach(counselor => {
                        const option = document.createElement('option');
                        option.value = counselor.realName;
                        option.textContent = counselor.realName;
                        counselorSelect.appendChild(option);
                    });
                    
                    // 填充文案选项
                    const writerSelect = document.getElementById('writerName');
                    writerSelect.innerHTML = ''; // 不添加默认选项
                    writers.forEach(writer => {
                        const option = document.createElement('option');
                        option.value = writer.realName;
                        option.textContent = writer.realName;
                        writerSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载咨询顾问和文案选项失败:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 加载学生数据
            loadStudents();

        });

            const modal = document.getElementById('studentModal');
            if (event.target == modal) {
