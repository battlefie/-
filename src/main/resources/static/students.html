                            app.fileContentType = latestDoc.fileContentType;
                            app.filePath = latestDoc.filePath;
                            app.documents = docsResponse.data;
                        } else {
                            app.fileName = null;
                            app.fileSize = null;
                            app.fileContentType = null;
                            app.filePath = null;
                            app.documents = [];
                        }
                    } catch (e) {
                        console.warn('获取文档信息失败:', e);
                        app.fileName = null;
                        app.documents = [];
                    }
                    
                    const formHtml = renderApplicationForm(studentId, app);
                    container.innerHTML = `<div class="application-form-container">${formHtml}</div>`;
                    const form = container.querySelector('form');
                    if (form) {
                        form.addEventListener('submit', (e) => {
                            e.preventDefault();
                            saveApplication(studentId, applicationId, form);
                        });
                    }
                    
                    // 滚动到表单位置
                    container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    container.innerHTML = `<div style="text-align: center; padding: 20px; color: #dc3545;">获取申请信息失败: ${response.message || '未知错误'}</div>`;
                }
            } catch (error) {
                console.error('获取申请信息失败:', error);
                container.innerHTML = `<div style="text-align: center; padding: 20px; color: #dc3545;">获取申请信息失败: ${error.message || '网络错误'}</div>`;
            }
        }

        // 在详情模态框中新增申请
        function addApplicationInDetail(studentId) {
            const container = document.getElementById(`application-form-container-${studentId}`);
            if (!container) return;
            
            // 清空容器
            container.innerHTML = '';
            
            const formHtml = renderApplicationForm(studentId, null);
            container.innerHTML = `<div class="application-form-container">${formHtml}</div>`;
            const form = container.querySelector('form');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    saveApplication(studentId, null, form);
                });
            }
            
            // 滚动到表单位置
            container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 刷新申请记录部分（不重新加载整个学生详情）
        async function refreshApplicationSection(studentId, newApplication = null) {
            try {
                // 获取最新的申请记录
                const appsResponse = await apiRequest(`/applications?studentId=${studentId}`);
                let applications = [];
                if (appsResponse.code === 200) {
                    if (Array.isArray(appsResponse.data)) {
                        applications = appsResponse.data;
                    } else if (appsResponse.data && Array.isArray(appsResponse.data.content)) {
                        applications = appsResponse.data.content;
                    }
                }
                
                // 为每个申请获取文档信息（文件信息现在在Document表中）
                for (let app of applications) {
                    try {
                        const docsResponse = await apiRequest(`/applications/${app.id}/documents`);
                        if (docsResponse.code === 200 && Array.isArray(docsResponse.data) && docsResponse.data.length > 0) {
                            // 使用最新的文档信息（向后兼容，保持app.fileName等字段）
                            const latestDoc = docsResponse.data[docsResponse.data.length - 1];
                            app.fileName = latestDoc.fileName;
                            app.fileSize = latestDoc.fileSize;
                            app.fileContentType = latestDoc.fileContentType;
                            app.filePath = latestDoc.filePath;
                            app.documents = docsResponse.data;
                        } else {
                            app.fileName = null;
                            app.fileSize = null;
                            app.fileContentType = null;
                            app.filePath = null;
                            app.documents = [];
                        }
                    } catch (e) {
                        console.warn(`获取申请${app.id}的文档失败:`, e);
                        app.fileName = null;
                        app.documents = [];
                    }
                }
                
                // 如果提供了新申请且不在列表中，添加它
                if (newApplication && !applications.some(app => app.id === newApplication.id)) {
                    // 为新申请也获取文档信息
                    try {
                        const docsResponse = await apiRequest(`/applications/${newApplication.id}/documents`);
                        if (docsResponse.code === 200 && Array.isArray(docsResponse.data) && docsResponse.data.length > 0) {
                            const latestDoc = docsResponse.data[docsResponse.data.length - 1];
                            newApplication.fileName = latestDoc.fileName;
                            newApplication.fileSize = latestDoc.fileSize;
                            newApplication.fileContentType = latestDoc.fileContentType;
                            newApplication.filePath = latestDoc.filePath;
                            newApplication.documents = docsResponse.data;
                        }
                    } catch (e) {
                        console.warn(`获取新申请${newApplication.id}的文档失败:`, e);
                    }
                    applications.push(newApplication);
                }
                
                // 获取学生信息
                const studentResponse = await apiRequest(`/students/${studentId}`);
                if (studentResponse.code !== 200) return;
                const student = studentResponse.data;
                
                // 查找申请记录部分的容器
                const viewContent = document.getElementById('viewStudentContent');
                if (!viewContent) return;
                
                // 查找或创建申请记录部分
                let applicationSection = viewContent.querySelector('.info-section h3')?.parentElement;
                if (!applicationSection || !applicationSection.querySelector('h3')?.textContent.includes('申请记录')) {
                    // 如果不存在，需要重新加载整个视图
                    await viewStudent(studentId);
                    return;
                }
                
                // 重新渲染申请记录部分
                if (applications.length > 0) {
                    const degreeTypeMap = {
                        'JUNIOR_HIGH': '初中',
                        'HIGH_SCHOOL': '高中',
                        'BACHELOR': '本科',
                        'MASTER': '硕士',
                        'PHD': '博士'
                    };
                    
                    const applicationStatusMap = {
                        'DRAFT': '草稿',
                        'SUBMITTED': '已提交',
                        'UNDER_REVIEW': '审核中',
                        'ACCEPTED': '已录取',
                        'REJECTED': '已拒绝',
                        'WAITLISTED': '候补',
                        'WITHDRAWN': '已撤回'
                    };
                    
                    function formatApplicationStatus(status) {
                        if (!status) return '未填写';
                        return applicationStatusMap[status] || status;
                    }
                    
                    const tableHtml = `
                        <h3>📝 申请记录（${applications.length}）</h3>
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                                <thead>
                                    <tr style="background: #f8f9fa; border-bottom: 2px solid #dee2e6;">
                                        <th style="padding: 12px; text-align: left; font-size: 13px; color: #495057; font-weight: 600;">申请学校</th>
                                        <th style="padding: 12px; text-align: left; font-size: 13px; color: #495057; font-weight: 600;">专业</th>
                                        <th style="padding: 12px; text-align: left; font-size: 13px; color: #495057; font-weight: 600;">学位</th>
                                        <th style="padding: 12px; text-align: left; font-size: 13px; color: #495057; font-weight: 600;">状态</th>
                                        <th style="padding: 12px; text-align: left; font-size: 13px; color: #495057; font-weight: 600;">申请日期</th>
                                        <th style="padding: 12px; text-align: left; font-size: 13px; color: #495057; font-weight: 600;">文案</th>
                                        <th style="padding: 12px; text-align: left; font-size: 13px; color: #495057; font-weight: 600;">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${applications.map((app, index) => `
                                        <tr style="border-bottom: 1px solid #e9ecef; ${index % 2 === 0 ? 'background: white;' : 'background: #f8f9fa;'}">
                                            <td style="padding: 12px; font-size: 13px; color: #212529;">${app.universityName || '—'}</td>
                                            <td style="padding: 12px; font-size: 13px; color: #212529;">${app.major || '—'}</td>
                                            <td style="padding: 12px; font-size: 13px; color: #212529;">${degreeTypeMap[app.degreeType] || app.degreeType || '—'}</td>
                                            <td style="padding: 12px;">
                                                <span class="application-status status-${app.status?.toLowerCase() || ''}" style="padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500;">
                                                    ${formatApplicationStatus(app.status)}
                                                </span>
                                            </td>
                                            <td style="padding: 12px; font-size: 13px; color: #212529;">${app.applicationDate || '—'}</td>
                                            <td style="padding: 12px; font-size: 13px; color: #212529;">${app.writer ? app.writer.realName : '—'}</td>
                                            <td style="padding: 12px;">
                                                <button class="btn-link" onclick="viewApplicationDetail(${student.id}, ${app.id})" style="margin-right: 8px; color: #667eea;">查看</button>
                                                <button class="btn-link" onclick="editApplicationInDetail(${student.id}, ${app.id})" style="margin-right: 8px; color: #28a745;">编辑</button>
                                                <button class="btn-link btn-danger-link" onclick="deleteApplicationInDetail(${student.id}, ${app.id})" style="color: #dc3545;">删除</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        <div style="margin-top: 15px; text-align: right;">
                            <button class="btn btn-small" onclick="addApplicationInDetail(${student.id})">+ 新增申请</button>
                        </div>
                        <div id="application-form-container-${student.id}" style="margin-top: 15px;">
                            <!-- 申请表单将在这里动态添加 -->
                        </div>
                    `;
                    
                    applicationSection.innerHTML = tableHtml;
                } else {
                    // 如果没有申请记录，显示空状态
                    applicationSection.innerHTML = `
                        <h3>📝 申请记录</h3>
                        <p style="color: #999; text-align: center; padding: 20px;">该学生暂无申请记录</p>
                        <div style="margin-top: 15px; text-align: center;">
                            <button class="btn btn-small" onclick="addApplicationInDetail(${student.id})">+ 新增申请</button>
                        </div>
                        <div id="application-form-container-${student.id}" style="margin-top: 15px;">
                            <!-- 申请表单将在这里动态添加 -->
                        </div>
                    `;
                }
            } catch (error) {
                console.error('刷新申请记录部分失败:', error);
                // 如果刷新失败，重新加载整个学生详情
                await viewStudent(studentId);
            }
        }

        // 在详情模态框中删除申请
        async function deleteApplicationInDetail(studentId, applicationId) {
            if (!confirm('确定要删除这个申请吗？')) return;
            
            try {
                const response = await apiRequest(`/applications/${applicationId}`, { method: 'DELETE' });
                if (response.code === 200) {
                    showMessage('删除成功', 'success');
                    // 重新加载学生详情
                    viewStudent(studentId);
                } else {
                    showMessage(response.message || '删除失败', 'error');
                }
            } catch (error) {
                console.error('删除申请失败:', error);
                showMessage('删除失败: ' + error.message, 'error');
            }
        }

        // 关闭申请表单（在详情模态框中）
        function closeApplicationForm(studentId) {
            const container = document.getElementById(`application-form-container-${studentId}`);
            if (container) {
                container.innerHTML = '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 检查权限，显示/隐藏用户管理链接
            const currentUser = getUser();
            const userManagementLink = document.getElementById('user-management-nav-link');
            if (userManagementLink) {
                userManagementLink.style.display = (currentUser && currentUser.role === 'SUPER_ADMIN') ? 'block' : 'none';
            }
            const conversionRateLink = document.getElementById('conversion-rate-nav-link');
            if (conversionRateLink) {
                conversionRateLink.style.display = (currentUser && currentUser.role === 'SUPER_ADMIN') ? 'block' : 'none';
            }
            
            loadStudents();
            loadCounselorsAndWriters();
            const searchInput = document.getElementById('searchStudent');
            if (searchInput) {
                searchInput.addEventListener('keypress', (event) => {
                    if (event.key === 'Enter') {
                        loadStudents();
                    }
                });
            }
        });

        // 高级搜索相关函数
        function showAdvancedSearch() {
            document.getElementById('advancedSearchModal').style.display = 'block';
        }

        function closeAdvancedSearchModal() {
            document.getElementById('advancedSearchModal').style.display = 'none';
        }

        function resetAdvancedSearch() {
            document.getElementById('advancedSearchForm').reset();
        }

        // 高级搜索表单提交
        document.getElementById('advancedSearchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('searchName').value.trim() || null,
                idCard: document.getElementById('searchIdCard').value.trim() || null,
                contact: document.getElementById('searchContact').value.trim() || null,
                gender: document.getElementById('searchGender').value || null,
                currentSchool: document.getElementById('searchCurrentSchool').value.trim() || null,
                major: document.getElementById('searchMajor').value.trim() || null,
                intendedCountry: document.getElementById('searchIntendedCountry').value.trim() || null,
                status: document.getElementById('searchStatus').value || null,
                fatherName: document.getElementById('searchFatherName').value.trim() || null,
                fatherContact: document.getElementById('searchFatherContact').value.trim() || null,
                fatherWorkInfo: document.getElementById('searchFatherWorkInfo').value.trim() || null,
                motherName: document.getElementById('searchMotherName').value.trim() || null,
                motherContact: document.getElementById('searchMotherContact').value.trim() || null,
                motherWorkInfo: document.getElementById('searchMotherWorkInfo').value.trim() || null,
                contractDateStart: document.getElementById('searchContractDateStart').value || null,
                contractDateEnd: document.getElementById('searchContractDateEnd').value || null
            };

            // 移除空值
            Object.keys(formData).forEach(key => {
                if (formData[key] === null || formData[key] === '') {
                    delete formData[key];
                }
            });

            try {
                const response = await apiRequest('/students/advanced-search', {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });

                if (response.code === 200) {
                    closeAdvancedSearchModal();
                    // 显示搜索结果
                    if (response.data.content) {
                        students = response.data.content;
                        paginationData = {
                            currentPage: response.data.currentPage || 0,
                            totalPages: response.data.totalPages || 0,
                            totalElements: response.data.totalElements || 0,
                            pageSize: response.data.pageSize || 10
                        };
                        displayStudents(students);
                        displayPagination(paginationData);
                    } else {
                        students = response.data;
                        displayStudents(students);
                        document.getElementById('pagination').innerHTML = '';
                    }
                    showMessage(`找到 ${response.data.totalElements || response.data.length || 0} 条结果`, 'success');
                } else {
                    showMessage('搜索失败: ' + response.message, 'error');
                }
            } catch (error) {
                console.error('搜索失败:', error);
                showMessage('搜索失败: ' + error.message, 'error');
            }
        });

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('studentModal');
            if (event.target == modal) {
                closeModal();
            }
            const advancedSearchModal = document.getElementById('advancedSearchModal');
            if (event.target == advancedSearchModal) {
                closeAdvancedSearchModal();
            }
        }
    </script>
</body>
</html>
